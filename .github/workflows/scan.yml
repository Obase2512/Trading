name: Trading Sentinel — discovery and paper alerts

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: Send a one-time Telegram connectivity test (manual only)
        type: boolean
        default: false
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: write

concurrency:
  group: sentinel-state
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate signal logic
        run: python -m unittest discover -s tests -v
      - name: Discover assets (GitHub logs only; no Telegram)
        run: python scanner.py
        env:
          TEST_TELEGRAM: ${{ inputs.test_telegram || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Check paper BUY/SELL signals (Telegram only when qualified)
        if: inputs.test_telegram != true
        run: python paper_alerts.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # PAPER_WATCHLIST defaults to the curated meme-coin universe in paper_alerts.py.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save non-sensitive research and paper states
        if: inputs.test_telegram != true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json data/paper_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh sentinel research and paper state'
            git push
          fi

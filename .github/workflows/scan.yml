name: Trading Sentinel — discovery and paper alerts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_telegram:
        description: Send a one-time Telegram connectivity test (manual only)
        type: boolean
        default: false
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'  # ~10m target; GH Actions may delay/skip

permissions:
  contents: write

concurrency:
  group: sentinel-state
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate signal logic
        run: python -m unittest discover -s tests -v
      - name: Discover assets (GitHub logs only; no Telegram)
        if: github.event_name != 'pull_request'
        run: python scanner.py
        env:
          TEST_TELEGRAM: ${{ inputs.test_telegram || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Research newly launched DEX pools (no Telegram or trades)
        if: github.event_name != 'pull_request' && inputs.test_telegram != true
        continue-on-error: true
        run: python new_launch_radar.py
      - name: Verify read-only DEX route provider health (no orders)
        if: github.event_name != 'pull_request' && inputs.test_telegram != true
        continue-on-error: true
        run: python dex_quote_health.py
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
      - name: Screen DEX leads and update isolated SHADOW simulation (no Telegram or orders)
        if: github.event_name != 'pull_request' && inputs.test_telegram != true
        continue-on-error: true
        run: python dex_shadow.py
        env:
          GOPLUS_ACCESS_TOKEN: ${{ secrets.GOPLUS_ACCESS_TOKEN }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
      - name: Check paper BUY/SELL signals (Telegram only when qualified)
        if: github.event_name != 'pull_request' && inputs.test_telegram != true
        run: python paper_alerts.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # PAPER_WATCHLIST defaults to the curated meme-coin universe in paper_alerts.py.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save non-sensitive research and paper states
        if: github.event_name != 'pull_request' && inputs.test_telegram != true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json data/paper_state.json data/new_launch_radar.json data/dex_shadow_state.json data/dex_security_reviews.json data/dex_quote_health.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh sentinel research and paper state'
            git push
          fi
